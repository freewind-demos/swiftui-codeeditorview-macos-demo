name: swiftui_codeeditorview_macos_demo
options:
  bundleIdPrefix: com.freewind
  deploymentTarget:
    macOS: "14.0"
packages:
  CodeEditorView:
    url: https://github.com/mchakravarty/CodeEditorView.git
    from: 0.15.4
  swift-syntax:
    url: https://github.com/swiftlang/swift-syntax.git
    from: 600.0.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  swiftui_codeeditorview_macos_demo:
    type: application
    platform: macOS
    productName: swiftui_codeeditorview_macos_demo
    sources:
      - Sources
    dependencies:
      - package: CodeEditorView
        product: CodeEditorView
      - package: CodeEditorView
        product: LanguageSupport
      - package: swift-syntax
        product: SwiftParser
      - package: swift-syntax
        product: SwiftSyntax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freewind.swiftuicodeeditorviewmacosdemo
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: []
schemes:
  swiftui_codeeditorview_macos_demo:
    build:
      targets:
        swiftui_codeeditorview_macos_demo: all
    run:
      config: Debug
